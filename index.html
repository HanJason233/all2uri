<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>all2uri</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <main class="main-content">
        <div class="workspace" id="workspace">
          <section class="panel input-panel" id="input-panel" aria-labelledby="input-title">
            <div class="panel-header">
              <div class="panel-title-group">
                <div>
                  <h2 id="input-title">输入</h2>
                </div>
              </div>
              <div class="panel-header-actions">
                <button class="text-button detail-button" id="input-detail-button" type="button" aria-expanded="false" aria-controls="input-panel">查看详情</button>
              </div>
            </div>

            <div class="field-heading">
              <div class="inline-actions">
                <button class="text-button" id="import-file-button" type="button">导入文件</button>
              </div>
            </div>
            <div class="textarea-wrap">
              <textarea
                id="subscription-urls"
                class="url-input"
                aria-label="订阅 / 节点内容"
                rows="9"
                spellcheck="false"
                autocomplete="off"
                placeholder="https://example.com/api/v1/client/subscribe?token=...&#10;vless://uuid@example.com:443#节点&#10;Clash YAML / sing-box / Xray JSON"
              ></textarea>
            </div>

            <div class="validation-message" id="validation-message" hidden></div>

            <div class="run-area">
              <button class="primary-button" id="convert-button" type="button">
                <span class="button-spinner" aria-hidden="true"></span>
                <span class="button-label">开始转换</span>
              </button>
            </div>
          </section>

          <div class="panel-resizer" data-resizer="0" role="separator" aria-orientation="vertical" aria-label="调整输入和处理版块宽度" title="拖动调整宽度，双击恢复均分" tabindex="0"></div>

          <section class="panel processing-panel" id="processing-panel" aria-labelledby="processing-title">
            <div class="panel-header">
              <div class="panel-title-group">
                <div>
                  <h2 id="processing-title">设置</h2>
                </div>
              </div>
              <div class="panel-header-actions">
                <span class="panel-status" id="processing-status" data-state="idle" role="status" hidden></span>
                <button class="text-button detail-button" id="processing-detail-button" type="button" aria-expanded="false" aria-controls="processing-panel">查看详情</button>
              </div>
            </div>

            <div class="settings-content" role="group" aria-label="应用设置">
              <section class="settings-card" aria-labelledby="settings-request-title">
                <div class="settings-card-heading">
                  <span class="settings-card-index" aria-hidden="true">01</span>
                  <div>
                    <h3 id="settings-request-title">订阅请求</h3>
                    <p>设置订阅服务识别的客户端类型。</p>
                  </div>
                </div>
                <div class="settings-field">
                  <label class="field-label" for="user-agent-select">User-Agent</label>
                  <select id="user-agent-select" class="select-input settings-control">
                    <option value="auto">自动识别（推荐）</option>
                    <option value="nekobox">NekoBox / Clash Meta</option>
                    <option value="sing-box">sing-box</option>
                    <option value="clash">Clash Meta</option>
                    <option value="v2rayn">v2rayN</option>
                    <option value="custom">自定义</option>
                  </select>
                  <input
                    id="custom-user-agent"
                    class="text-input settings-control custom-user-agent"
                    type="text"
                    maxlength="512"
                    spellcheck="false"
                    autocomplete="off"
                    placeholder="例如：MyClient/1.0"
                    hidden
                  />
                  <span class="settings-help">自动识别失败时会尝试常见客户端标识。</span>
                </div>
              </section>

              <section class="settings-card" aria-labelledby="settings-limits-title">
                <div class="settings-card-heading">
                  <span class="settings-card-index" aria-hidden="true">02</span>
                  <div>
                    <h3 id="settings-limits-title">请求限制</h3>
                    <p>限制下载体积、跳转次数和同时请求数。</p>
                  </div>
                </div>
                <div class="settings-limits-grid">
                  <div class="settings-field">
                    <label class="field-label" for="max-response-mib">响应上限（MiB）</label>
                    <input id="max-response-mib" class="text-input number-input settings-control" type="number" min="1" max="64" step="1" value="2" inputmode="numeric" />
                    <span class="settings-help">1–64 MiB</span>
                  </div>
                  <div class="settings-field">
                    <label class="field-label" for="max-redirects">最大重定向</label>
                    <input id="max-redirects" class="text-input number-input settings-control" type="number" min="0" max="50" step="1" value="10" inputmode="numeric" />
                    <span class="settings-help">0–50 次</span>
                  </div>
                  <div class="settings-field">
                    <label class="field-label" for="fetch-concurrency">并发请求</label>
                    <input id="fetch-concurrency" class="text-input number-input settings-control" type="number" min="1" max="20" step="1" value="3" inputmode="numeric" aria-describedby="fetch-concurrency-note" />
                    <span class="settings-help" id="fetch-concurrency-note">1–20 个来源</span>
                  </div>
                </div>
              </section>

              <div class="settings-card-pair">
                <section class="settings-card settings-security" aria-labelledby="settings-security-title">
                  <div class="settings-card-heading">
                    <span class="settings-card-index" aria-hidden="true">03</span>
                    <div>
                      <h3 id="settings-security-title">连接安全</h3>
                      <p>只对可信的订阅源调整这些权限。</p>
                    </div>
                  </div>
                  <div class="settings-switch-list">
                    <button class="toggle-button settings-switch" id="allow-local-network" type="button" aria-pressed="false">
                      <span class="settings-switch-copy">
                        <strong>允许本机及局域网</strong>
                        <span>访问本地部署的订阅服务</span>
                      </span>
                      <span class="switch-track" aria-hidden="true"></span>
                    </button>
                    <button class="toggle-button settings-switch" id="skip-certificate-verification" type="button" aria-pressed="false">
                      <span class="settings-switch-copy">
                        <strong>跳过证书验证</strong>
                        <span>忽略 HTTPS 证书错误</span>
                      </span>
                      <span class="switch-track" aria-hidden="true"></span>
                    </button>
                    <p class="option-note security-note" id="skip-certificate-note" hidden>证书校验已关闭，请确认订阅源可信。</p>
                  </div>
                </section>

                <section class="settings-card settings-output" aria-labelledby="settings-output-title">
                  <div class="settings-card-heading">
                    <span class="settings-card-index" aria-hidden="true">04</span>
                    <div>
                      <h3 id="settings-output-title">输出规则</h3>
                      <p>控制生成结果的完整度与重复项。</p>
                    </div>
                  </div>
                  <div class="settings-switch-list">
                    <button class="toggle-button settings-switch" id="deduplicate-output" type="button" aria-pressed="true">
                      <span class="settings-switch-copy">
                        <strong>自动去重</strong>
                        <span>合并重复的节点结果</span>
                      </span>
                      <span class="switch-track" aria-hidden="true"></span>
                    </button>
                    <button class="toggle-button settings-switch" id="include-lossy-output" type="button" aria-pressed="false">
                      <span class="settings-switch-copy">
                        <strong>包含有损结果</strong>
                        <span>输出无法完整表达的节点</span>
                      </span>
                      <span class="switch-track" aria-hidden="true"></span>
                    </button>
                  </div>
                </section>
              </div>
            </div>

            <div class="processing-progress">
              <div class="progress-copy" id="progress-copy" aria-live="polite">准备就绪</div>
              <div class="progress-track" aria-hidden="true">
                <span id="progress-bar"></span>
              </div>
            </div>
          </section>

          <div class="panel-resizer" data-resizer="1" role="separator" aria-orientation="vertical" aria-label="调整处理和输出版块宽度" title="拖动调整宽度，双击恢复均分" tabindex="0"></div>

          <section class="panel output-panel" id="output-panel" aria-labelledby="result-title">
            <div class="panel-header">
              <div class="panel-title-group">
                <div>
                  <h2 id="result-title">输出</h2>
                </div>
              </div>
              <div class="panel-header-actions">
                <div class="result-stats" aria-live="polite">
                  <span><strong id="node-count">0</strong> 节点</span>
                  <span><strong id="source-count">0</strong> 来源</span>
                  <span><strong id="duplicate-count">0</strong> 重复</span>
                </div>
                <button class="text-button detail-button" id="output-detail-button" type="button" aria-expanded="false" aria-controls="output-panel">查看详情</button>
              </div>
            </div>

            <div class="empty-state" id="empty-state" aria-live="polite">
              <strong id="empty-state-title">等待输出</strong>
            </div>

            <div class="output-area" id="output-area" hidden>
              <div class="output-heading">
                <label for="output-uris">节点 URI</label>
                <span id="output-size"></span>
              </div>
              <textarea id="output-uris" class="output-textarea" readonly spellcheck="false"></textarea>
              <div class="output-actions">
                <button class="secondary-button" id="copy-button" type="button">
                  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <rect x="6.5" y="6.5" width="9" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4" />
                    <path d="M13 6V4.8c0-.7-.6-1.3-1.3-1.3H5.8c-.7 0-1.3.6-1.3 1.3v7.4c0 .7.6 1.3 1.3 1.3H6.5" stroke="currentColor" stroke-width="1.4" />
                  </svg>
                  复制全部
                </button>
                <button class="primary-button compact" id="save-button" type="button">
                  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M10 3v9m0 0 3.2-3.2M10 12 6.8 8.8M4 13.8v1.5c0 .9.7 1.7 1.7 1.7h8.6c.9 0 1.7-.7 1.7-1.7v-1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  保存 TXT
                </button>
              </div>
            </div>
          </section>
        </div>
      </main>

      <section class="log-panel" aria-labelledby="log-title">
        <div class="log-header">
          <strong id="log-title">日志</strong>
          <button class="text-button" id="clear-log-button" type="button">清空日志</button>
        </div>
        <div class="log-list" id="log-list" role="log" aria-live="polite"></div>
      </section>
    </div>

    <div class="detail-backdrop" id="detail-backdrop" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
